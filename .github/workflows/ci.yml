name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"  # keep in step with the uv that wrote uv.lock and constraints.txt
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -n 1
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Tests (fast)
        run: uv run pytest

  browser:
    name: extension in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"  # keep in step with the uv that wrote uv.lock and constraints.txt
          python-version: "3.12"
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -n 1
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m "browser and not slow"

  install-unix:
    name: install.sh (${{ matrix.os }}, ${{ matrix.app-dir }} app dir)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        app-dir: [default, spaced]
    env:
      MINUTA_REPO_URL: ${{ github.workspace }}
      MINUTA_EXTRAS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -n 1
      - name: Put the source in a folder whose path has spaces
        if: matrix.app-dir == 'spaced'
        run: echo "MINUTA_APP_DIR=$RUNNER_TEMP/minuta with spaces/app" >> "$GITHUB_ENV"
      - name: Install from this checkout and set up
        run: sh install.sh --non-interactive --name CI --no-browser --skip-extension
      - name: Use it
        run: |
          MINUTA="$(uv tool dir --bin)/minuta"
          "$MINUTA" --version
          "$MINUTA" status
          "$MINUTA" doctor || true
          "$MINUTA" list
      - name: Uninstall leaves nothing behind
        run: |
          "$(uv tool dir --bin)/minuta" uninstall --yes --delete-data
          test ! -e "$(uv tool dir --bin)/minuta"
          case "$(uname -s)" in
            Darwin) base="$HOME/Library/Application Support/minuta"; test ! -e "$HOME/Library/LaunchAgents/io.minuta.server.plist" ;;
            *) base="$HOME/.local/share/minuta"; test ! -e "$HOME/.config/systemd/user/minuta.service"; test ! -e "$HOME/.config/minuta" ;;
          esac
          test ! -e "$base"
          test -z "${MINUTA_APP_DIR:-}" || test ! -e "$MINUTA_APP_DIR"

  install-windows:
    name: install.ps1 (windows, ${{ matrix.app-dir }} app dir)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app-dir: [default, spaced]
    env:
      MINUTA_REPO_URL: ${{ github.workspace }}
      MINUTA_EXTRAS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -n 1
      - name: Put the source in a folder whose path has spaces
        if: matrix.app-dir == 'spaced'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "MINUTA_APP_DIR=$env:RUNNER_TEMP\minuta with spaces\app"
      - name: Install from this checkout and set up
        shell: pwsh
        run: ./install.ps1 --non-interactive --name CI --no-browser --skip-extension
      - name: Use it
        shell: pwsh
        run: |
          $m = Join-Path (uv tool dir --bin).Trim() "minuta.exe"
          & $m --version
          & $m status
          & $m list
      - name: Uninstall leaves nothing behind
        shell: pwsh
        run: |
          $bin = (uv tool dir --bin).Trim()
          $tool = Join-Path (uv tool dir).Trim() "minuta"
          & (Join-Path $bin "minuta.exe") uninstall --yes --delete-data
          # minuta.exe cannot delete itself on Windows: a hidden PowerShell finishes once it has exited.
          $deadline = (Get-Date).AddSeconds(90)
          while (((Test-Path (Join-Path $bin "minuta.exe")) -or (Test-Path $tool)) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          $log = Join-Path $env:TEMP "minuta-uninstall.log"  # kept only when something could not be removed
          if (Test-Path $log) { Get-Content $log }
          if (Test-Path (Join-Path $bin "minuta.exe")) { throw "minuta.exe left behind" }
          if (Test-Path $tool) { throw "tool environment left behind" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "minuta")) { throw "data or app folder left behind" }
          if (Test-Path (Join-Path $env:APPDATA "minuta")) { throw "config left behind" }
          if ($env:MINUTA_APP_DIR -and (Test-Path $env:MINUTA_APP_DIR)) { throw "app folder left behind" }
          schtasks /Query /TN minuta 2>$null; if ($LASTEXITCODE -eq 0) { throw "scheduled task left behind" }
          exit 0
